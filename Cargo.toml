[package]
name = "spl-type-length-value"
version = "0.6.0"
description = "Solana Program Library Type Length Value"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hamkj7hpo/spl-type-length-value"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
spl-pod = { git = "https://github.com/hamkj7hpo/spl-pod.git", rev = "c1b81ff0773a434bd456dcbf2890a12003d70dca", package = "spl-pod" }
solana-program = { git = "https://github.com/hamkj7hpo/solana.git", rev = "079536b934de349771fa8a0e9945bcef01f529cc", package = "solana-program" }
bytemuck = { version = "1.18.0", features = ["derive"] }

[workspace]
members = ["tlv-account-resolution"]

[patch.crates-io]
spl-tlv-account-resolution = { path = "./tlv-account-resolution" }
